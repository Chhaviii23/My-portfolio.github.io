<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Canvas Drawing</title>
    <style>
        body{
            font-family: Arial;
            background:#fff8f0;
            padding:20px;
        }
        .wrap{
            width:600px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:6px;
            text-align:center;
        }
        canvas{
            border:2px solid #333;
            background:#f8f9fa;
        }
    </style>
</head>
<body>

<div class="wrap">
    <h2>Simple Canvas Drawing</h2>
    <p>Drawing a house and a sun using JS</p>

    <canvas id="canvas" width="500" height="250"></canvas>
</div>

<script>
    let c = document.getElementById("canvas");
    let ctx = c.getContext("2d");

    // house body
    ctx.fillStyle = "#0d6efd";
    ctx.fillRect(150,100,200,150);

    // roof
    ctx.fillStyle = "#dc3545";
    ctx.beginPath();
    ctx.moveTo(150,100);
    ctx.lineTo(250,20);
    ctx.lineTo(350,100);
    ctx.closePath();
    ctx.fill();

    // sun
    ctx.fillStyle = "#ffc107";
    ctx.beginPath();
    ctx.arc(75,75,40,0,Math.PI*2);
    ctx.fill();
</script>

</body>
</html>
