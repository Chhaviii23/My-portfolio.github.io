<!DOCTYPE html>
<html>
<head>
  <title>Inline, Internal, External CSS</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Internal CSS -->
  <style>
    h2 {
      color: royalblue;
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body style="background-color: floralwhite;">

  <!-- Inline CSS -->
  <h1 style="color: crimson;">Exploring Beautiful Destinations</h1>

  <!-- Internal CSS applied -->
  <h2>Wonders of Nature</h2>
  <p>The world is full of places that inspire awe — from mountains to coral reefs, each tells a story of nature’s magic.</p>

  <!-- External CSS applied -->
  <div class="external-box">
    <h3>Why Travel?</h3>
    <p>Travel opens your heart, broadens your mind, and fills your life with unforgettable memories.</p>
  </div>

</body>
</html>
