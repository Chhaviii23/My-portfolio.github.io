<!DOCTYPE html>
<html>
<head>
  <title>Responsive Travel Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Explore the World</h1>
  </header>

  <section class="gallery">
    <div class="card">
      <img src="beach.png" alt="Beach">
      <p>Sunny Beaches</p>
    </div>
    <div class="card">
      <img src="Mountains.png" alt="Mountains">
      <p>Majestic Mountains</p>
    </div>
    <div class="card">
      <img src="Big-City-Lights.png" alt="City Lights">
      <p>Vibrant Cities</p>
    </div>
  </section>

  <footer class="footer">
    <p>Travel more, explore deeper.</p>
  </footer>
</body>
</html>
