<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body>
<h2>College Registration Form</h2>
<hr width="30%" align="left">
<form action="#" method="post">
<p><b>Full Name: </b><input type="text" name="fullname" size="44" required placeholder="Enter your full name"></p>
<p><b>Email Address: </b><input type="email" name="email" size="40" required placeholder="xyz@example.com"></p>
<p><b>Gender:</b>
<input type="radio" name="gender" value="male"> Male
<input type="radio" name="gender" value="female"> Female
<input type="radio" name="gender" value="other"> Other
</p>
<p><b>Courses Interested:</b><br>
<input type="checkbox" name="course" value="webdev"> Web Development
<input type="checkbox" name="course" value="networking"> Networking
<input type="checkbox" name="course" value="design"> Graphic Design
</p>
<p><b>Year Level:</b>
<select name="year">
<option value="1st">1st Year</option>
<option value="2nd">2nd Year</option>
<option value="3rd">3rd Year</option>
<option value="4th">4th Year</option>
</select>
</p>
<p>
<input type="submit" value="Submit Form">
<input type="reset" value="Reset">
</p>
</form>
</body>
</html>
