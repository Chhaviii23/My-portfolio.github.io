<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conditionals and Loops</title>
    <style>
        body { 
            font-family: sans-serif;
            background-color: #f0f9ff;
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
        }
        pre { 
            background: #eee; 
            padding: 15px; 
            border-radius: 5px; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Demonstrating Conditionals and Loops</h1>
        <p>The output below is generated by different JavaScript control structures.</p>
        <pre id="output"></pre>
    </div>

    <script>
        let outputText = "";

        // 1. Conditional (if-else) Statement
        const currentHour = new Date().getHours();
        outputText += "--- Conditional Statement ---\n";
        if (currentHour < 12) {
            outputText += "Good Morning!\n\n";
        } else if (currentHour < 18) {
            outputText += "Good Afternoon!\n\n";
        } else {
            outputText += "Good Evening!\n\n";
        }

        // 2. 'for' loop
        outputText += "--- 'for' loop (prints 1 to 5) ---\n";
        for (let i = 1; i <= 5; i++) {
            outputText += `Count: ${i}\n`;
        }
        outputText += "\n";

        // 3. 'while' loop
        outputText += "--- 'while' loop (counts down from 3) ---\n";
        let j = 3;
        while (j > 0) {
            outputText += `Countdown: ${j}\n`;
            j--;
        }
        outputText += "\n";
        
        // 4. 'do...while' loop
        outputText += "--- 'do...while' loop (runs at least once) ---\n";
        let k = 5;
        do {
            outputText += `This will run at least once. k = ${k}\n`;
            k++;
        } while (k < 5); // Condition is false, but it already ran once

        document.getElementById('output').textContent = outputText;
    </script>
</body>
</html>
